<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaBank</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .accounts {
            margin-top: 40px;
            border-top: 2px solid #eee;
            padding-top: 30px;
        }

        .accounts h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .account-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .account-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .info-item {
            font-size: 14px;
        }

        .info-label {
            color: #999;
            font-weight: 500;
        }

        .info-value {
            color: #333;
            font-weight: 600;
        }

        .account-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .account-actions button {
            flex: 1;
            padding: 8px;
            font-size: 13px;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-danger {
            background: #dc3545;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏦 JavaBank</h1>

        <div id="message" class="message"></div>

        <div style="border-bottom: 2px solid #eee; padding-bottom: 30px;">
            <h3 style="color: #333; margin-bottom: 20px; font-size: 16px;">Criar Nova Conta</h3>

            <div class="form-group">
                <label for="holderName">Nome do Titular</label>
                <input type="text" id="holderName" placeholder="Ex: João Silva">
            </div>

            <div class="form-group">
                <label for="accountNumber">Número da Conta</label>
                <input type="text" id="accountNumber" placeholder="Ex: 123456">
            </div>

            <button onclick="createAccount()">Criar Conta</button>
        </div>

        <div class="accounts">
            <h2>Minhas Contas</h2>
            <div id="accountsList" class="empty-state">
                <p>Nenhuma conta criada ainda. Crie uma acima! 👆</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/accounts';

        async function createAccount() {
            const holderName = document.getElementById('holderName').value;
            const accountNumber = document.getElementById('accountNumber').value;

            if (!holderName || !accountNumber) {
                showMessage('Preencha todos os campos!', 'error');
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ holderName, accountNumber, balance: 0.0 })
                });

                if (response.ok) {
                    showMessage('✓ Conta criada com sucesso!', 'success');
                    document.getElementById('holderName').value = '';
                    document.getElementById('accountNumber').value = '';
                    loadAccounts();
                } else {
                    showMessage('Erro ao criar conta!', 'error');
                }
            } catch (error) {
                showMessage('Erro de conexão: ' + error.message, 'error');
            }
        }

        async function loadAccounts() {
            try {
                const response = await fetch(API_URL);
                const accounts = await response.json();

                const list = document.getElementById('accountsList');
                if (accounts.length === 0) {
                    list.innerHTML = '<p style="text-align: center; color: #999;">Nenhuma conta criada ainda. Crie uma acima! 👆</p>';
                    return;
                }

                list.innerHTML = accounts.map(acc => `
                    <div class="account-card">
                        <div class="account-info">
                            <div class="info-item">
                                <div class="info-label">Titular</div>
                                <div class="info-value">${acc.holderName}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Conta</div>
                                <div class="info-value">${acc.accountNumber}</div>
                            </div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Saldo</div>
                            <div class="info-value" style="font-size: 18px; color: #28a745;">R$ ${acc.balance.toFixed(2)}</div>
                        </div>
                        <div class="account-actions">
                            <button class="btn-success" onclick="depositMoney('${acc.accountNumber}')">💰 Depositar</button>
                            <button class="btn-danger" onclick="withdrawMoney('${acc.accountNumber}')">💸 Sacar</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Erro ao carregar contas:', error);
            }
        }

        async function depositMoney(accountNumber) {
            const amount = prompt(`Quanto deseja depositar em ${accountNumber}?`);
            if (!amount || isNaN(amount) || amount <= 0) {
                showMessage('Valor inválido!', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${accountNumber}/deposit?amount=${amount}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    showMessage(`✓ Depósito de R$ ${parseFloat(amount).toFixed(2)} realizado!`, 'success');
                    loadAccounts();
                } else {
                    showMessage('Erro ao depositar!', 'error');
                }
            } catch (error) {
                showMessage('Erro: ' + error.message, 'error');
            }
        }

        async function withdrawMoney(accountNumber) {
            const amount = prompt(`Quanto deseja sacar de ${accountNumber}?`);
            if (!amount || isNaN(amount) || amount <= 0) {
                showMessage('Valor inválido!', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${accountNumber}/withdraw?amount=${amount}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    showMessage(`✓ Saque de R$ ${parseFloat(amount).toFixed(2)} realizado!`, 'success');
                    loadAccounts();
                } else {
                    showMessage('Saldo insuficiente ou conta não encontrada!', 'error');
                }
            } catch (error) {
                showMessage('Erro: ' + error.message, 'error');
            }
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            setTimeout(() => {
                msg.className = 'message';
            }, 4000);
        }

        // Carregar contas ao abrir a página
        loadAccounts();
    </script>
</body>
</html>
